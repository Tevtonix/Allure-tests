name: Run API Tests and Publish Allure Report

# Запуск будет происходить при push/pull_request в ветку main
# И вручную через вкладку Actions (workflow_dispatch)
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    
    # Права (permissions) для того, чтобы GitHub Actions мог пушить Allure-отчет в ветку gh-pages
    permissions:
      contents: write

    steps:
      # 1. Получение кода репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установка Python (Подсказка со слайда)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Можно изменить под вашу версию Python

      # 3. Установка зависимостей (из requirements.txt)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Запуск тестов (с генерацией результатов allure-results)
      - name: Run tests with pytest
        run: pytest --alluredir=allure-results
        continue-on-error: true # Важно: продолжаем выполнение, даже если тесты упали, чтобы отчет сформировался

      # 5. Получение истории прошлых отчетов (чтобы в Allure строились графики трендов)
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 6. Генерация Allure отчета
      - name: Build Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages

      # 7. Публикация отчета в ветку gh-pages для GitHub Pages
      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history